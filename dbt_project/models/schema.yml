version: 2

models:
  - name: customer_order_summary
    description: >
      One row per customer, summarizing their completed orders — total
      order count, total revenue, and average order value. Used by
      downstream reporting dashboards to show customer lifetime value.
    columns:
      - name: customer_id
        description: Unique identifier for the customer. Foreign key to raw_customers.
        tests:
          - unique
          - not_null
      - name: full_name
        description: Customer's full name.
      - name: email
        description: Customer's email address.
      - name: country
        description: Customer's country, used for regional revenue breakdowns.
      - name: total_orders
        description: Count of completed orders for this customer.
      - name: total_revenue
        description: >
          Sum of order_amount across all completed orders for this
          customer. MUST be numeric — this is a common breakage point
          if the upstream order_amount column type ever drifts to text.
        tests:
          - not_null
      - name: avg_order_value
        description: Average order_amount across completed orders for this customer.

sources:
  - name: raw
    schema: main
    description: Raw tables loaded directly from the mock data generator, before any dbt transformation.
    tables:
      - name: raw_customers
        description: >
          One row per customer. customer_id is an INTEGER primary key.
          Loaded by scripts/generate_mock_data.py.
      - name: raw_orders
        description: >
          One row per order. order_amount is a DOUBLE (numeric) column —
          this is the column our schema-drift scenario corrupts by
          injecting text values, simulating an upstream API change.
          Loaded by scripts/generate_mock_data.py.
